services:
  wemeet-app:
    image: ${ECR_IMAGE}
    container_name: wemeet-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-11000}:${APP_SERVER_PORT:-11000}"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: aws
      APP_SERVER_PORT: ${APP_SERVER_PORT:-11000}
