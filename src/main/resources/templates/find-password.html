<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기')}"></head>
<body>
<div class="app-shell">
    <header th:if="${!hideShellNavigation}" th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>비밀번호 찾기</h1>
            <p>가입한 이름, 이메일, 아이디가 일치하면 임시 비밀번호를 메일로 받을 수 있습니다.</p>

            <div class="notice-banner" th:if="${passwordResetTemporaryPassword != null and redPlaceholderIndex == 0}">
                <strong>조회 결과</strong>
                <span>
                    <span th:text="${passwordResetName}">홍길동</span>
                    /
                    <span th:text="${passwordResetEmail}">user@example.com</span>
                    /
                    <span th:text="${passwordResetLoginId}">wemeet_user</span>
                    계정의 임시 비밀번호는
                    <strong th:text="${passwordResetTemporaryPassword}">WM123456!</strong>
                    입니다.
                </span>
            </div>

            <div class="notice-banner" th:if="${passwordResetTemporaryPassword != null and redPlaceholderIndex != 0}">
                <strong>조회 결과</strong>
                <span>임시 비밀번호를 메일로 보냈습니다.</span>
            </div>

            <div class="notice-banner notice-banner--error" th:if="${passwordResetLookupError}">
                <strong>계정 확인 실패</strong>
                <span th:text="${passwordResetLookupError}">아이디와 이메일이 일치하는 계정을 찾지 못했습니다.</span>
            </div>

            <form class="form-stack" method="post" th:action="@{/find-password/verify}">
                <div>
                    <label class="field-label" for="name">이름</label>
                    <input class="text-input" th:classappend="${redPlaceholderIndex == 1} ? ' text-input--danger-placeholder'" id="name" name="name" type="text"
                           th:value="${passwordResetName}"
                           placeholder="이름을 입력하세요"
                           autocomplete="name"
                           required>
                </div>
                <div>
                    <label class="field-label" for="email">이메일</label>
                    <input class="text-input" th:classappend="${redPlaceholderIndex == 2} ? ' text-input--danger-placeholder'" id="email" name="email" type="email"
                           th:value="${passwordResetEmail}"
                           placeholder="가입한 이메일을 입력하세요"
                           autocomplete="email"
                           pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                           title="올바른 이메일 형식을 입력해주세요. 예: user@example.com"
                           required>
                </div>
                <div>
                    <label class="field-label" for="loginId">아이디</label>
                    <input class="text-input" th:classappend="${redPlaceholderIndex == 3} ? ' text-input--danger-placeholder'" id="loginId" name="loginId" type="text"
                           th:value="${passwordResetLoginId}"
                           placeholder="아이디를 입력하세요"
                           autocomplete="username"
                           required>
                </div>
                <button class="primary-button" type="submit">비밀번호 찾기</button>
            </form>

            <div class="login-links">
                <a th:href="@{/login}">로그인</a>
                <a th:href="@{/signup}">회원가입</a>
                <a th:href="@{/find-id}">아이디 찾기</a>
            </div>
        </section>
    </main>

    <nav th:if="${!hideShellNavigation}" th:replace="~{fragments/layout :: guestBottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
