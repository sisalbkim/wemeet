<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 재확인')}"></head>
<body>
<div class="app-shell">
    <header th:if="${!hideShellNavigation}" th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page">
        <section class="page-heading">
            <div>
                <h1>비밀번호 재확인</h1>
                <p>프로필 수정을 위해 현재 비밀번호를 다시 입력해주세요.</p>
            </div>
            <a class="ghost-button" th:href="@{/profile}">돌아가기</a>
        </section>

        <section class="panel" th:if="${profileVerifyPasswordError != null}">
            <div class="notice-banner notice-banner--error">
                <strong th:text="${profileVerifyPasswordError}">비밀번호가 올바르지 않습니다.</strong>
            </div>
        </section>

        <section class="panel">
            <form class="form-stack" method="post" th:action="@{/profile/verify-password}">
                <div>
                    <label class="field-label" for="password">현재 비밀번호</label>
                    <input class="text-input" th:classappend="${redPlaceholderIndex == 1} ? ' text-input--danger-placeholder'" id="password" name="password"
                           type="password"
                           placeholder="현재 비밀번호를 입력하세요"
                           required>
                </div>
                <button class="primary-button" type="submit">확인</button>
                <a class="ghost-button" th:href="@{/profile}">취소</a>
            </form>
        </section>
    </main>

</div>
</body>
</html>
