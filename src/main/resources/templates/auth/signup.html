<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<div class="app-shell">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>회원가입</h1>
            <div class="notice-banner notice-banner--error" th:if="${signupError}">
                <strong>회원가입 실패</strong>
                <span th:text="${signupError}">입력값을 확인해주세요.</span>
            </div>

            <form class="form-stack" method="post" th:action="@{/signup}" data-signup-form
                  th:attr="data-verified-email=${signupVerifiedEmail}">
                <div>
                    <label class="field-label" for="nickname">이름</label>
                    <input class="text-input" id="nickname" name="nickname" placeholder="이름을 입력하세요" th:value="${signupNickname}" required>
                </div>
                <div>
                    <label class="field-label" for="userId">아이디</label>
                    <div class="inline-row">
                        <input class="text-input" id="userId" name="userId" placeholder="로그인용 아이디를 입력하세요" th:value="${signupUserId}" required>
                        <button class="secondary-button secondary-button--compact" type="button" data-user-id-check-button>중복확인</button>
                    </div>
                    <p class="muted-note signup-feedback" data-user-id-check-feedback>아이디 중복 여부를 먼저 확인해주세요.</p>
                </div>
                <div>
                    <label class="field-label" for="email">이메일</label>
                    <div class="inline-row">
                        <input class="text-input" id="email" name="email" type="email"
                               placeholder="비밀번호 재설정에 사용할 이메일"
                               th:value="${signupEmail}"
                               pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                               title="올바른 이메일 형식을 입력해주세요. 예: user@example.com"
                               required>
                        <button class="secondary-button secondary-button--compact" type="button" data-email-check-button>중복확인</button>
                    </div>
                    <p class="muted-note signup-feedback" data-email-check-feedback>이메일 중복 여부를 먼저 확인해주세요.</p>
                </div>
                <div>
                    <label class="field-label" for="emailVerificationCode">이메일 인증</label>
                    <div class="inline-row signup-auth-row">
                        <input class="text-input text-input--code" id="emailVerificationCode" type="text" placeholder="인증코드를 입력하세요" autocomplete="one-time-code">
                        <button class="secondary-button secondary-button--compact" type="button" data-email-send-button>이메일 전송</button>
                        <button class="secondary-button secondary-button--compact" type="button" data-email-verify-button>인증 확인</button>
                    </div>
                    <p class="muted-note signup-feedback" data-email-verify-feedback></p>
                </div>
                <div>
                    <label class="field-label" for="signupPassword">비밀번호</label>
                    <input class="text-input" id="signupPassword" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password" required>
                </div>
                <div>
                    <label class="field-label" for="confirmPassword">비밀번호 확인</label>
                    <input class="text-input" id="confirmPassword" name="confirmPassword" type="password" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required>
                </div>
                <div>
                    <label class="field-label" for="baseAddress">기본 출발지 주소</label>
                    <input class="text-input" id="baseAddress" name="baseAddress" placeholder="예: 서울특별시 중구 명동길 74" th:value="${signupBaseAddress}">
                </div>
                <button class="primary-button" type="submit">회원가입 완료</button>
                <div class="login-links">
                    <a th:href="@{/find-id}">아이디 찾기</a>
                    <a th:href="@{/find-password}">비밀번호 찾기</a>
                </div>
                <div class="helper-row helper-row--center">
                    <span class="muted-note">이미 가입 하셨나요?</span>
                    <a class="text-link" th:href="@{/login}">로그인</a>
                </div>
            </form>
        </section>
    </main>

    <nav th:replace="~{fragments/layout :: guestBottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
