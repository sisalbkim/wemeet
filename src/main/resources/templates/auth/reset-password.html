<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<div class="app-shell">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>비밀번호 변경</h1>
            <p>
                <strong th:text="${passwordResetUserId}">user123</strong>
                /
                <span th:text="${passwordResetEmail}">user123@wemeet.local</span>
                계정의 새 비밀번호를 입력하세요.
            </p>

            <div class="notice-banner" th:if="${passwordResetLookupSuccess}">
                <strong>계정 확인 완료</strong>
                <span th:text="${passwordResetLookupSuccess}">계정이 확인되었습니다. 새 비밀번호를 입력해주세요.</span>
            </div>

            <div class="notice-banner notice-banner--error" th:if="${passwordResetConfirmError}">
                <strong>비밀번호 변경 실패</strong>
                <span th:text="${passwordResetConfirmError}">비밀번호 확인이 일치하지 않습니다.</span>
            </div>

            <form class="form-stack" method="post" th:action="@{/find-password/reset}">
                <div>
                    <label class="field-label" for="newPassword">새 비밀번호</label>
                    <input class="text-input" id="newPassword" name="newPassword" type="password"
                           placeholder="새 비밀번호를 입력하세요"
                           autocomplete="new-password"
                           required>
                </div>
                <div>
                    <label class="field-label" for="confirmPassword">새 비밀번호 확인</label>
                    <input class="text-input" id="confirmPassword" name="confirmPassword" type="password"
                           placeholder="새 비밀번호를 다시 입력하세요"
                           autocomplete="new-password"
                           required>
                </div>
                <button class="primary-button" type="submit">비밀번호 변경</button>
            </form>

            <div class="login-links">
                <a th:href="@{/login}">로그인</a>
                <a th:href="@{/find-id}">아이디 찾기</a>
                <a th:href="@{/find-password}">비밀번호 찾기 다시하기</a>
            </div>
        </section>
    </main>

    <nav th:replace="~{fragments/layout :: guestBottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
