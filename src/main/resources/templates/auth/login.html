<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<div class="app-shell" th:attr="data-view-mode=${viewMode}">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>로그인</h1>
            <div class="signup-success-modal" th:if="${signupSuccess}" role="dialog" aria-modal="true" aria-labelledby="signupSuccessTitle" data-signup-success-modal>
                <div class="signup-success-modal__backdrop" data-signup-success-close></div>
                <section class="signup-success-modal__card">
                    <p class="signup-success-modal__eyebrow">회원가입 완료</p>
                    <h2 id="signupSuccessTitle">
                        <strong th:text="${registeredNickname != null ? registeredNickname : '새 사용자'}">새 사용자</strong>님,
                        회원가입을 축하합니다.
                    </h2>
                    <p>이제 가입한 아이디와 비밀번호로 로그인할 수 있습니다.</p>
                    <button class="primary-button" type="button" data-signup-success-close>로그인하기</button>
                </section>
            </div>
            <div class="notice-banner notice-banner--error" th:if="${error}">
                <strong>로그인 실패</strong>
                <span th:text="${loginErrorMessage != null ? loginErrorMessage : '아이디 또는 비밀번호를 다시 확인해주세요.'}">
                    아이디 또는 비밀번호를 다시 확인해주세요.
                </span>
            </div>
            <div class="notice-banner" th:if="${passwordResetSuccess}">
                <strong>계정 안내</strong>
                <span th:text="${passwordResetSuccess}">임시 비밀번호를 이메일로 전송했습니다.</span>
            </div>
            <div class="notice-banner" th:if="${accountDeletedNotice}">
                <strong>회원탈퇴 완료</strong>
                <span th:text="${accountDeletedNotice}">회원탈퇴가 완료되었습니다.</span>
            </div>

            <form class="form-stack" method="post" th:action="@{/login}">
                <div>
                    <label class="field-label" for="userId">아이디</label>
                    <input class="text-input" id="userId" name="userId" placeholder="아이디를 입력하세요" autocomplete="username" required>
                </div>
                <div>
                    <label class="field-label" for="password">비밀번호</label>
                    <input class="text-input" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
                </div>
                <label>
                    <input type="checkbox" name="autoLogin" value="true">
                    자동로그인
                </label>
                <button class="primary-button" type="submit">로그인</button>
            </form>

            <div class="login-links">
                <a th:href="@{/signup}">회원가입</a>
                <a th:href="@{/find-id}">아이디 찾기</a>
                <a th:href="@{/find-password}">비밀번호 찾기</a>
            </div>
        </section>
    </main>

    <nav th:replace="~{fragments/layout :: guestBottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
