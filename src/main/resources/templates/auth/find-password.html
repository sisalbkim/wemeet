<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기')}"></head>
<body>
<div class="app-shell">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>비밀번호 찾기</h1>
            <p>가입한 아이디와 이메일이 일치하면 해당 이메일로 임시 비밀번호를 보내드립니다.</p>

            <div class="notice-banner notice-banner--error" th:if="${passwordResetLookupError}">
                <strong>계정 확인 실패</strong>
                <span th:text="${passwordResetLookupError}">아이디와 이메일이 일치하는 계정을 찾지 못했습니다.</span>
            </div>

            <form class="form-stack" method="post" th:action="@{/find-password/verify}">
                <div>
                    <label class="field-label" for="email">이메일</label>
                    <input class="text-input" id="email" name="email" type="email"
                           th:value="${passwordResetEmail}"
                           placeholder="가입한 이메일을 입력하세요"
                           autocomplete="email"
                           pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                           title="올바른 이메일 형식을 입력해주세요. 예: user@example.com"
                           required>
                </div>
                <div>
                    <label class="field-label" for="userId">아이디</label>
                    <input class="text-input" id="userId" name="userId" type="text"
                           th:value="${passwordResetUserId}"
                           placeholder="아이디를 입력하세요"
                           autocomplete="username"
                           required>
                </div>
                <button class="primary-button" type="submit">비밀번호 찾기</button>
            </form>

            <div class="login-links">
                <a th:href="@{/login}">로그인</a>
                <a th:href="@{/signup}">회원가입</a>
                <a th:href="@{/find-id}">아이디 찾기</a>
            </div>
        </section>
    </main>

    <nav th:replace="~{fragments/layout :: guestBottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
