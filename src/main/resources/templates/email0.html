<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('이메일 경고 모음')}"></head>
<body>
<div class="app-shell">
    <main class="page page--guest">
        <section class="login-card">
            <div class="hero-brand">
                <img class="hero-brand__full" th:src="@{/img/brand-hero.png}" alt="we meet">
            </div>
            <h1>이메일 경고 모음</h1>
            <p>화면설계서에 넣기 쉽게 이메일 입력 관련 경고를 브라우저 안내창 형태로 모아둔 mock 페이지입니다.</p>

            <div class="email-warning-stack">
                <section class="email-warning-card">
                    <p class="email-warning-card__label">필수 입력</p>
                    <div class="validation-bubble">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">이 입력란을 작성하세요.</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">@ 누락</p>
                    <div class="validation-bubble">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">'@' 문자를 포함해 주세요.</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">도메인 형식 오류</p>
                    <div class="validation-bubble">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">올바른 이메일 형식을 입력해주세요.</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">예시 안내</p>
                    <div class="validation-bubble">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">예: user@example.com</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">이메일 중복</p>
                    <div class="validation-bubble validation-bubble--danger">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">이미 사용 중인 이메일입니다.</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">인증 전 안내</p>
                    <div class="validation-bubble validation-bubble--soft">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">이메일 중복 여부를 먼저 확인해주세요.</span>
                    </div>
                </section>

                <section class="email-warning-card">
                    <p class="email-warning-card__label">인증코드 오류</p>
                    <div class="validation-bubble validation-bubble--danger">
                        <span class="validation-bubble__icon">!</span>
                        <span class="validation-bubble__text">인증코드가 일치하지 않습니다.</span>
                    </div>
                </section>
            </div>
        </section>
    </main>
</div>
</body>
</html>
