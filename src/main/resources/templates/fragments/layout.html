<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | WeMeet'}">WeMeet</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <script defer th:src="@{/js/common-ui.js}"></script>
    <script defer th:src="@{/js/recommendation-map.js}"></script>
    <script defer th:src="@{/js/signup.js}"></script>
</head>
<body>
<div th:fragment="brandLockup" class="brand-lockup">
    <img class="brand-lockup__symbol" th:src="@{/img/brand-symbol.png}" alt="" aria-hidden="true">
    <img class="brand-lockup__wordmark" th:src="@{/img/brand-wordmark.png}" alt="we meet">
</div>

<header th:fragment="topBar" class="topbar">
    <a class="brand" th:href="@{/}" aria-label="WeMeet 홈">
        <div th:replace="~{fragments/layout :: brandLockup}"></div>
    </a>
</header>

<nav th:fragment="bottomNav(activeTab)" class="bottom-nav">
    <a class="bottom-nav__item" th:classappend="${activeTab == 'home'} ? ' is-active'" th:href="@{/}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path>
        </svg>
        <span>홈</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${activeTab == 'friends'} ? ' is-active'" th:href="@{/friends}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 12a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm7 0a2.5 2.5 0 1 0-2.5-2.5A2.5 2.5 0 0 0 16 12zM4 19a5 5 0 0 1 10 0M13.5 19a4 4 0 0 1 7.5-1.8"></path>
        </svg>
        <span>친구</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${activeTab == 'create'} ? ' is-active'" th:href="@{/meetings/new}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
            <circle cx="12" cy="12" r="8.5"></circle>
        </svg>
        <span>모임 생성</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${activeTab == 'history'} ? ' is-active'" th:href="@{/history}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"></path>
            <path d="M12 8v5l3 1.8"></path>
        </svg>
        <span>검색 기록</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${activeTab == 'profile'} ? ' is-active'" th:href="@{/profile}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 12 12z"></path>
            <path d="M5 20a7 7 0 0 1 14 0"></path>
        </svg>
        <span>프로필</span>
    </a>
</nav>

<nav th:fragment="guestBottomNav(activeTab)" class="bottom-nav">
    <a class="bottom-nav__item" th:classappend="${activeTab == 'guest-home'} ? ' is-active'" th:href="@{/}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path>
        </svg>
        <span>홈</span>
    </a>
    <span class="bottom-nav__item bottom-nav__item--placeholder" aria-hidden="true">
        <span class="bottom-nav__ghost"></span>
        <span>&nbsp;</span>
    </span>
    <a class="bottom-nav__item bottom-nav__item--wide"
       th:classappend="${activeTab == 'nearby'} ? ' is-active'"
       th:href="@{/guest/plan}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.4-4.4"></path>
            <circle cx="11" cy="11" r="6.5"></circle>
        </svg>
        <span>근처 장소 검색</span>
    </a>
    <span class="bottom-nav__item bottom-nav__item--placeholder" aria-hidden="true">
        <span class="bottom-nav__ghost"></span>
        <span>&nbsp;</span>
    </span>
    <a class="bottom-nav__item" th:classappend="${activeTab == 'login'} ? ' is-active'" th:href="@{/user/login}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"></path>
            <path d="M13 8l5 4-5 4"></path>
            <path d="M18 12H9"></path>
        </svg>
        <span>로그인</span>
    </a>
</nav>
</body>
</html>
