<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('검색 기록')}"></head>
<body>
<div class="app-shell" th:attr="data-view-mode=${viewMode}">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page">
        <section class="page-heading page-heading--compact"
                 style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>검색 기록</h1>
            </div>

            <form method="post"
                  th:action="@{/history/clear}"
                  data-confirm-submit="검색 기록을 모두 삭제할까요?">
                <input type="hidden" name="filter" th:value="${selectedFilter}">
                <input type="hidden" name="keyword" th:value="${keyword}">

                <button class="text-button" type="submit">
                    전체 삭제
                </button>
            </form>
        </section>

        <section class="panel">
            <form class="search-form" method="get" th:action="@{/history}">
                <input class="text-input"
                       name="keyword"
                       placeholder="검색 기록 찾기..."
                       th:value="${keyword}">
                <input type="hidden" name="filter" th:value="${selectedFilter}">
                <button class="visually-hidden" type="submit">검색</button>
            </form>
        </section>

        <section class="panel">
            <div class="chip-grid chip-grid--compact">
                <a class="filter-chip filter-chip--link" th:each="category : ${categories}"
                   th:href="@{/history(filter=${category.label}, keyword=${keyword})}"
                   th:classappend="${selectedFilter == category.label} ? ' is-active'"
                   th:text="${category.label}">
                    전체
                </a>
            </div>
        </section>

        <section class="card-stack">
            <article class="history-card" th:each="item : ${searchHistory}">
                <div class="history-card__icon"></div>
                <div class="history-card__body">
                    <strong th:text="${item.query}">강남 맛집</strong>
                    <div class="meta-row">
                        <span class="mini-tag" th:text="${item.category}">맛집</span>
                        <span th:text="${item.dateLabel}">2026. 3. 10.</span>
                    </div>
                </div>
                <form method="post" th:action="@{/history/remove}">
                    <input type="hidden" name="historyId" th:value="${item.id}">
                    <input type="hidden" name="filter" th:value="${selectedFilter}">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <button class="history-card__remove" type="submit">닫기</button>
                </form>
            </article>
            <p class="empty-state" th:if="${#lists.isEmpty(searchHistory)}">조건에 맞는 검색 기록이 없습니다.</p>
        </section>


    </main>

    <nav th:replace="~{fragments/layout :: bottomNav(${activeTab})}"></nav>
</div>
</body>
</html>
