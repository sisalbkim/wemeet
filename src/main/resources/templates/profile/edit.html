<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('프로필 수정')}"></head>
<body>
<div class="app-shell" th:attr="data-view-mode=${viewMode}">
    <header th:replace="~{fragments/layout :: topBar}"></header>

    <main class="page">
        <section class="page-heading">
            <div>
                <h1>프로필 수정</h1>
                <p>수정할 항목을 선택해서 변경하세요.</p>
            </div>
            <a class="ghost-button page-heading__action" th:href="@{/profile}">돌아가기</a>
        </section>

        <section class="panel" th:if="${profileNotice != null}">
            <div class="notice-banner">
                <strong th:text="${profileNotice}">기본 출발지 주소가 수정되었습니다.</strong>
            </div>
        </section>

        <section class="panel" th:if="${profilePasswordNotice != null}">
            <div class="notice-banner">
                <strong th:text="${profilePasswordNotice}">비밀번호가 변경되었습니다.</strong>
            </div>
        </section>

        <section class="panel" th:if="${profilePasswordError != null}">
            <div class="notice-banner notice-banner--error">
                <strong th:text="${profilePasswordError}">비밀번호를 변경하지 못했습니다.</strong>
            </div>
        </section>

        <section class="panel" th:if="${profilePasswordNotice == null}">
            <div class="chip-grid chip-grid--compact chip-grid--three-up profile-edit-tabs">
                <a class="filter-chip filter-chip--link"
                   th:classappend="${selectedProfileEditTab == 'password'} ? ' is-active'"
                   th:href="@{/profile/edit(editTab='password')}">비밀번호 변경</a>
                <a class="filter-chip filter-chip--link"
                   th:classappend="${selectedProfileEditTab == 'address'} ? ' is-active'"
                   th:href="@{/profile/edit(editTab='address')}">기본 출발지 수정</a>
                <a class="filter-chip filter-chip--danger"
                   th:href="@{/profile/delete}">회원탈퇴</a>
            </div>

            <div class="form-stack" th:if="${selectedProfileEditTab == 'password'}">
                <div class="section-heading section-heading--stacked">
                    <h2>비밀번호 변경</h2>
                    <span>새 비밀번호로 바로 변경됩니다</span>
                </div>
                <form class="form-stack" method="post" th:action="@{/profile/password}">
                    <div>
                        <label class="field-label" for="newPassword">새 비밀번호</label>
                        <input class="text-input"
                               id="newPassword" name="newPassword"
                               type="password"
                               placeholder="새 비밀번호를 입력하세요"
                               required>
                    </div>
                    <div>
                        <label class="field-label" for="confirmPassword">비밀번호 확인</label>
                        <input class="text-input"
                               id="confirmPassword" name="confirmPassword"
                               type="password"
                               placeholder="비밀번호를 다시 입력하세요"
                               required>
                    </div>
                    <button class="primary-button" type="submit">비밀번호 저장</button>
                </form>
            </div>

            <div class="form-stack" th:if="${selectedProfileEditTab == 'address'}">
                <div class="section-heading section-heading--stacked">
                    <h2>기본 출발지 수정</h2>
                    <span>모임 추천 계산에 바로 반영됩니다</span>
                </div>
                <form class="form-stack" method="post" th:action="@{/profile/address}">
                    <div>
                        <label class="field-label" for="baseAddress">집 주소</label>
                        <input class="text-input"
                               id="baseAddress" name="baseAddress"
                               th:value="${profile.baseAddress}"
                               placeholder="예: 서울특별시 중구 명동길 74"
                               required>
                    </div>
                    <button class="primary-button" type="submit">주소 저장</button>
                </form>
            </div>
        </section>
    </main>

</div>
</body>
</html>
