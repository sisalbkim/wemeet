server.port=8082
spring.datasource.url=jdbc:h2:file:./build/wemeetdb;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
app.redis.enabled=${REDIS_ENABLED:true}
app.openapi.enabled=true
app.ui.force-transit-visible=true
app.security.require-https=false
app.security.canonical-host=
server.servlet.session.cookie.secure=false
app.mail.preview-fallback-enabled=true
