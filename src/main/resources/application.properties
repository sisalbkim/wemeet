spring.application.name=wemeet
spring.config.import=optional:file:./.wemeet.local.properties
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mariadb://192.168.121.128:3306/wemeet?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:wemeet}
spring.datasource.password=${DB_PASSWORD:wemeet1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
app.redis.enabled=${REDIS_ENABLED:true}
app.redis.session-ttl-minutes=${REDIS_SESSION_TTL_MINUTES:720}
app.redis.recommendation-ttl-minutes=${REDIS_RECOMMENDATION_TTL_MINUTES:30}
app.openapi.enabled=${OPEN_API_ENABLED:true}
app.openapi.user-agent=${OPEN_API_USER_AGENT:WeMeet/1.0 (spring-boot project)}
app.openapi.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.openapi.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.openapi.route-profile=${ROUTE_PROFILE:driving}
app.openapi.walking-route-profile=${WALKING_ROUTE_PROFILE:foot}
app.openapi.naver-search.base-url=${NAVER_SEARCH_BASE_URL:https://openapi.naver.com}
app.openapi.naver-search.client-id=${NAVER_SEARCH_CLIENT_ID:}
app.openapi.naver-search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
app.openapi.naver-maps.base-url=${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
app.openapi.naver-maps.api-key-id=${NAVER_MAPS_API_KEY_ID:}
app.openapi.naver-maps.api-key=${NAVER_MAPS_API_KEY:}
app.openapi.naver-maps.directions-path=${NAVER_MAPS_DIRECTIONS_PATH:/map-direction/v1/driving}
app.openapi.naver-maps.geocode-path=${NAVER_MAPS_GEOCODE_PATH:/map-geocode/v2/geocode}
app.openapi.naver-maps.reverse-geocode-path=${NAVER_MAPS_REVERSE_GEOCODE_PATH:/map-reversegeocode/v2/gc}
app.openapi.naver-maps.route-option=${NAVER_MAPS_ROUTE_OPTION:traoptimal}
app.openapi.odsay.enabled=${ODSAY_ENABLED:true}
app.openapi.odsay.base-url=${ODSAY_BASE_URL:https://api.odsay.com}
app.openapi.odsay.api-key=${ODSAY_API_KEY:}
app.openapi.odsay.transit-path=${ODSAY_TRANSIT_PATH:/v1/api/searchPubTransPathT}
app.openapi.odsay.load-lane-path=${ODSAY_LOAD_LANE_PATH:/v1/api/loadLane}
app.naver-map.key-id=${NAVER_MAPS_JS_KEY_ID:${NAVER_MAPS_JS_CLIENT_ID:}}
app.security.require-https=${REQUIRE_HTTPS:false}
