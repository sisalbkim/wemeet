spring.application.name=wemeet
spring.config.import=optional:file:./.wemeet.local.properties
spring.thymeleaf.cache=false
server.port=${APP_SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
spring.datasource.url=${DB_URL:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
app.redis.enabled=${REDIS_ENABLED:true}
app.redis.session-ttl-minutes=${REDIS_SESSION_TTL_MINUTES:30}
app.redis.recommendation-ttl-minutes=${REDIS_RECOMMENDATION_TTL_MINUTES:30}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.preview-fallback-enabled=${MAIL_PREVIEW_FALLBACK_ENABLED:false}
app.mail.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:WeMeet}
app.mail.signup-verification-subject=${MAIL_SIGNUP_SUBJECT:[WeMeet] \uc774\uba54\uc77c \uc778\uc99d\ucf54\ub4dc \uc548\ub0b4}
app.openapi.enabled=${OPEN_API_ENABLED:true}
app.openapi.connect-timeout-millis=${OPEN_API_CONNECT_TIMEOUT_MILLIS:3000}
app.openapi.read-timeout-millis=${OPEN_API_READ_TIMEOUT_MILLIS:5000}
app.openapi.user-agent=${OPEN_API_USER_AGENT:WeMeet/1.0 (spring-boot project)}
app.openapi.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.openapi.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.openapi.route-profile=${ROUTE_PROFILE:driving}
app.openapi.walking-route-profile=${WALKING_ROUTE_PROFILE:foot}
app.openapi.naver-search.base-url=${NAVER_SEARCH_BASE_URL:https://openapi.naver.com}
app.openapi.naver-search.client-id=${NAVER_SEARCH_CLIENT_ID:}
app.openapi.naver-search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
app.openapi.naver-maps.base-url=${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
app.openapi.naver-maps.api-key-id=${NAVER_MAPS_API_KEY_ID:}
app.openapi.naver-maps.api-key=${NAVER_MAPS_API_KEY:}
app.openapi.naver-maps.directions-path=${NAVER_MAPS_DIRECTIONS_PATH:/map-direction/v1/driving}
app.openapi.naver-maps.geocode-path=${NAVER_MAPS_GEOCODE_PATH:/map-geocode/v2/geocode}
app.openapi.naver-maps.reverse-geocode-path=${NAVER_MAPS_REVERSE_GEOCODE_PATH:/map-reversegeocode/v2/gc}
app.openapi.naver-maps.route-option=${NAVER_MAPS_ROUTE_OPTION:traoptimal}
app.openapi.odsay.enabled=${ODSAY_ENABLED:true}
app.openapi.odsay.base-url=${ODSAY_BASE_URL:https://api.odsay.com}
app.openapi.odsay.api-key=${ODSAY_API_KEY:}
app.openapi.odsay.transit-path=${ODSAY_TRANSIT_PATH:/v1/api/searchPubTransPathT}
app.openapi.odsay.load-lane-path=${ODSAY_LOAD_LANE_PATH:/v1/api/loadLane}
app.openapi.tmap.enabled=${TMAP_ENABLED:true}
app.openapi.tmap.base-url=${TMAP_BASE_URL:https://apis.openapi.sk.com}
app.openapi.tmap.app-key=${TMAP_APP_KEY:}
app.openapi.tmap.pedestrian-path=${TMAP_PEDESTRIAN_PATH:/tmap/routes/pedestrian}
app.openapi.tmap.version=${TMAP_VERSION:1}
app.naver-map.key-id=${NAVER_MAPS_JS_KEY_ID:${NAVER_MAPS_JS_CLIENT_ID:}}
app.security.require-https=${REQUIRE_HTTPS:false}
app.security.canonical-host=${CANONICAL_HOST:}
app.auth.jwt.issuer=${JWT_ISSUER:wemeet}
app.auth.jwt.secret=${JWT_SECRET:wemeet-dev-api-jwt-secret-change-me}
app.auth.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:30}
app.auth.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:14}
app.auth.jwt.access-cookie-name=${JWT_ACCESS_COOKIE_NAME:WM_ACCESS_TOKEN}
app.auth.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:WM_REFRESH_TOKEN}
app.auth.jwt.csrf-cookie-name=${JWT_CSRF_COOKIE_NAME:WM_CSRF_TOKEN}
app.auth.jwt.csrf-header-name=${JWT_CSRF_HEADER_NAME:X-CSRF-TOKEN}
app.auth.jwt.cookie-secure=${JWT_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
app.auth.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}
