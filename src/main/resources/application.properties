spring.application.name=wemeet
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/wemeet?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:wemeet}
spring.datasource.password=${DB_PASSWORD:wemeet1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
app.redis.enabled=${REDIS_ENABLED:true}
app.redis.session-ttl-minutes=${REDIS_SESSION_TTL_MINUTES:720}
app.redis.recommendation-ttl-minutes=${REDIS_RECOMMENDATION_TTL_MINUTES:30}
app.openapi.enabled=${OPEN_API_ENABLED:true}
app.openapi.user-agent=${OPEN_API_USER_AGENT:WeMeet/1.0 (spring-boot project)}
app.openapi.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.openapi.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.openapi.route-profile=${ROUTE_PROFILE:driving}
app.security.require-https=${REQUIRE_HTTPS:false}
