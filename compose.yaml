services:
  mariadb:
    image: mariadb:11.4
    container_name: wemeet-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wemeet
      MARIADB_USER: wemeet
      MARIADB_PASSWORD: wemeet1234
      MARIADB_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: wemeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mariadb_data:
  redis_data:
